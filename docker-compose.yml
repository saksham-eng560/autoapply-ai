# Local development / single-machine setup.
#   cp .env.example .env   # add your ANTHROPIC_API_KEY (optional) and Google OAuth credentials (optional)
#   docker compose up --build
# Dashboard: http://localhost:3000   API docs: http://localhost:8000/docs
name: autoapply

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true  # reaps Chromium child processes
  image: autoapply-backend:local
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://autoapply:autoapply@postgres:5432/autoapply
    REDIS_URL: redis://redis:6379/0
    LOCAL_STORAGE_PATH: /data/storage
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  volumes:
    - storage:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"  # lets the agent reach the demo site on your machine (Linux too)
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: autoapply
      POSTGRES_DB: autoapply
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply -d autoapply"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *backend
    command: ["api"]
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: ["worker"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10"]
      interval: 60s
      timeout: 30s
      start_period: 30s
    shm_size: "1gb"  # Chromium needs shared memory
    depends_on:
      api:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["beat"]
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    image: autoapply-frontend:local
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
