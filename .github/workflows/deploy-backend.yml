# Deploys the backend image (API, Celery worker, Celery beat) to AWS ECS Fargate after CI passes on main.
#
# One-time setup (see README "Deploying to AWS + Vercel"):
#   Repository variables: AWS_REGION, AWS_ROLE_ARN (GitHub OIDC role allowed to push to ECR and update ECS),
#                         ECS_CLUSTER, optional ECR_REPOSITORY (default autoapply-backend),
#                         optional ECS_SERVICES (default "autoapply-api autoapply-worker autoapply-beat")
# Every ECS service runs the same image; its task definition sets the command (api | worker | beat).
# The API applies database migrations on start-up (serialized with a Postgres advisory lock).
# Without AWS_ROLE_ARN the workflow is skipped, so forks and VPS users are unaffected.
name: Deploy backend (AWS ECS)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'autoapply-backend' }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICES: ${{ vars.ECS_SERVICES || 'autoapply-api autoapply-worker autoapply-beat' }}
      GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.GIT_SHA }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.GIT_SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Roll out new task definitions
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.GIT_SHA }}
        run: |
          set -euo pipefail
          for service in $ECS_SERVICES; do
            current=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$service" \
              --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$current" --query taskDefinition \
              | jq --arg image "$IMAGE" --arg repo "$ECR_REPOSITORY" '
                  .containerDefinitions |= map(if (.image | contains($repo)) then .image = $image else . end)
                  | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
              > "task-$service.json"
            new=$(aws ecs register-task-definition --cli-input-json "file://task-$service.json" \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "$service -> $new"
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$service" --task-definition "$new" >/dev/null
          done

      - name: Wait for services to become stable
        run: aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services $ECS_SERVICES
