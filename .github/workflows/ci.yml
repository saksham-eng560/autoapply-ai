name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: autoapply
          POSTGRES_PASSWORD: autoapply
          POSTGRES_DB: autoapply
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autoapply -d autoapply"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://autoapply:autoapply@localhost:5432/autoapply
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-hs256-signing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Ruff
        run: |
          ruff check app tests alembic/env.py
          ruff check ../scripts

      - name: Bandit (security lint)
        run: bandit -q -r app -ll

      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Create test database
        run: PGPASSWORD=autoapply psql -h localhost -U autoapply -d autoapply -c "CREATE DATABASE autoapply_test"

      - name: Tests (SQLite)
        run: python -m pytest -q

      - name: Tests (PostgreSQL + pgvector, incl. browser end-to-end)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://autoapply:autoapply@localhost:5432/autoapply_test
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered

  frontend:
    name: Dashboard (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          BACKEND_URL: http://localhost:8000

  extension:
    name: Chrome extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate manifest and scripts
        working-directory: extension
        run: |
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) throw new Error('MV3 required'); console.log(m.name, m.version)"
          for f in *.js; do node --check "$f"; done
      - name: Package
        run: cd extension && zip -r ../autoapply-extension.zip . -x '*.DS_Store'
      - uses: actions/upload-artifact@v4
        with:
          name: autoapply-extension
          path: autoapply-extension.zip

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: autoapply-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: autoapply-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Smoke-test backend image
        run: |
          docker run --rm -e DATABASE_URL=sqlite:////tmp/smoke.db autoapply-backend:ci \
            python -c "import app.main, app.worker.celery_app; from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(); print('chromium', b.version); b.close(); p.stop()"
